<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clara - Assistente PagBank</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="iphone-frame">
    <section class="phone-screen">

      <div class="status-bar">
        <span id="currentTime">9:41</span>

        <div class="status-icons">
          <svg class="status-signal" viewBox="0 0 24 14">
            <rect x="1" y="9" width="3" height="4" rx="1"></rect>
            <rect x="6" y="7" width="3" height="6" rx="1"></rect>
            <rect x="11" y="4" width="3" height="9" rx="1"></rect>
            <rect x="16" y="1" width="3" height="12" rx="1"></rect>
          </svg>

          <svg class="status-wifi" viewBox="0 0 24 18">
            <path d="M3 6.5C8.2 2.5 15.8 2.5 21 6.5"></path>
            <path d="M6.8 10.2C9.8 8 14.2 8 17.2 10.2"></path>
            <path d="M10.2 13.5C11.3 12.8 12.7 12.8 13.8 13.5"></path>
            <circle cx="12" cy="15.5" r="1.2"></circle>
          </svg>

          <svg class="status-battery" viewBox="0 0 30 14">
            <rect x="1" y="2" width="24" height="10" rx="3"></rect>
            <rect x="26" y="5" width="3" height="4" rx="1"></rect>
            <rect x="3.5" y="4.5" width="18" height="5" rx="1.5"></rect>
          </svg>
        </div>
      </div>

      <div class="dynamic-island"></div>

      <!-- TELA 1: DISCADOR -->
      <section class="dial-screen" id="dialScreen">
        <div class="dial-number" id="dialNumber">0800 723 4000</div>

        <div class="dial-keypad">
          <button type="button">1<span></span></button>
          <button type="button">2<span>ABC</span></button>
          <button type="button">3<span>DEF</span></button>

          <button type="button">4<span>GHI</span></button>
          <button type="button">5<span>JKL</span></button>
          <button type="button">6<span>MNO</span></button>

          <button type="button">7<span>PQRS</span></button>
          <button type="button">8<span>TUV</span></button>
          <button type="button">9<span>WXYZ</span></button>

          <button type="button">*<span></span></button>
          <button type="button">0<span>+</span></button>
          <button type="button">#<span></span></button>
        </div>

        <button class="call-start-button" id="callStartButton" type="button" onclick="startCall()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.24.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
        </button>

        <nav class="phone-tabs" aria-label="Abas do telefone">
          <button type="button">
            <span class="tab-icon star-icon"></span>
            Favoritos
          </button>

          <button type="button">
            <span class="tab-icon recent-icon"></span>
            Recentes
          </button>

          <button type="button">
            <span class="tab-icon contacts-icon"></span>
            Contatos
          </button>

          <button type="button" class="active">
            <span class="tab-icon keypad-icon"></span>
            Teclado
          </button>

          <button type="button">
            <span class="tab-icon voicemail-icon"></span>
            Voicemail
          </button>
        </nav>
      </section>

      <!-- TELA 2: LIGAÇÃO ATIVA -->
      <section class="call-screen hidden" id="callScreen">
        <div class="call-info" id="callInfo">
          <span id="callStatus">chamando...</span>
          <h1>0800 723 4000</h1>
          <p id="callTimer" class="hidden">00:00</p>
        </div>

        <div class="in-call-keypad hidden" id="keypadScreen">
          <div class="call-number-small">0800 723 4000</div>
          <div class="typed-key" id="typedKey"></div>

          <div class="keypad-grid">
            <button type="button" onclick="pressKey('1')">1<span></span></button>
            <button type="button" onclick="pressKey('2')">2<span>ABC</span></button>
            <button type="button" onclick="pressKey('3')">3<span>DEF</span></button>

            <button type="button" onclick="pressKey('4')">4<span>GHI</span></button>
            <button type="button" onclick="pressKey('5')">5<span>JKL</span></button>
            <button type="button" onclick="pressKey('6')">6<span>MNO</span></button>

            <button type="button" onclick="pressKey('7')">7<span>PQRS</span></button>
            <button type="button" onclick="pressKey('8')">8<span>TUV</span></button>
            <button type="button" onclick="pressKey('9')">9<span>WXYZ</span></button>

            <button type="button" onclick="pressKey('*')">*<span></span></button>
            <button type="button" onclick="pressKey('0')">0<span>+</span></button>
            <button type="button" onclick="pressKey('#')">#<span></span></button>
          </div>

          <button class="hide-keypad" type="button" onclick="toggleKeypad()">ocultar</button>
        </div>

        <div class="call-actions" id="callActions">
          <button class="action-btn" type="button" onclick="toggleMute()">
            <span id="muteIcon" class="action-circle">
              <svg viewBox="0 0 24 24">
                <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V5a3.5 3.5 0 0 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5Z"></path>
                <path d="M5 10.8a7 7 0 0 0 14 0"></path>
                <path d="M12 17.8V21"></path>
                <path d="M8.8 21h6.4"></path>
              </svg>
            </span>
            <small>mudo</small>
          </button>

          <button class="action-btn" id="keypadButton" type="button" onclick="toggleKeypad()">
            <span class="action-circle">
              <svg class="keypad-svg" viewBox="0 0 60 60">
                <circle cx="15" cy="15" r="3.8"></circle>
                <circle cx="30" cy="15" r="3.8"></circle>
                <circle cx="45" cy="15" r="3.8"></circle>

                <circle cx="15" cy="30" r="3.8"></circle>
                <circle cx="30" cy="30" r="3.8"></circle>
                <circle cx="45" cy="30" r="3.8"></circle>

                <circle cx="15" cy="45" r="3.8"></circle>
                <circle cx="30" cy="45" r="3.8"></circle>
                <circle cx="45" cy="45" r="3.8"></circle>
              </svg>
            </span>
            <small>teclado</small>
          </button>

          <button class="action-btn" type="button" onclick="toggleSpeaker()">
            <span id="speakerIcon" class="action-circle">
              <svg viewBox="0 0 24 24">
                <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
                <path d="M17 9.5a4 4 0 0 1 0 5"></path>
              </svg>
            </span>
            <small>áudio</small>
          </button>

          <button class="action-btn disabled-visual" type="button">
            <span class="action-circle">
              <svg viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </span>
            <small>adicionar</small>
          </button>

          <button class="action-btn disabled-visual" type="button">
            <span class="action-circle">
              <svg viewBox="0 0 24 24">
                <rect x="3.5" y="7" width="12" height="10" rx="2"></rect>
                <path d="M15.5 10l5-3v10l-5-3"></path>
              </svg>
            </span>
            <small>FaceTime</small>
          </button>

          <button class="action-btn disabled-visual" type="button">
            <span class="action-circle">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 20c.8-4 3.2-6 6.5-6s5.7 2 6.5 6"></path>
              </svg>
            </span>
            <small>contatos</small>
          </button>
        </div>

        <div class="bottom-area">
          <button class="end-button" id="endButton" type="button" onclick="endCall()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.24.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
            </svg>
          </button>
        </div>
      </section>

      <div class="toast hidden" id="toast"></div>

      <audio id="uraAudio" src="audio-ura.mp3"></audio>
      <audio id="uraAudio2" src="audio-ura2.mp3"></audio>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
